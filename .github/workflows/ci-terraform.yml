name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/ci-terraform.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_ROOT: terraform/environments/demo/gcp
  TF_IN_AUTOMATION: "true"

jobs:
  format:
    name: terraform-format
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read Terraform version
        id: tf-version
        run: echo "version=$(cat terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ./terraform

  validate:
    name: terraform-validate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read Terraform version
        id: tf-version
        run: echo "version=$(cat terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      - name: Terraform Init
        run: terraform init -backend=false -input=false
        working-directory: ${{ env.TF_ROOT }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_ROOT }}

  # A fork PR gets no secrets, so the plan runs only for branches of this repository.
  plan:
    name: terraform-plan
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    needs: [format, validate]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read Terraform version
        id: tf-version
        run: echo "version=$(cat terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          cli_config_credentials_token: ${{ secrets.TF_PLAN_TOKEN }}

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ${{ env.TF_ROOT }}

      # The Actions log is public, and a plan prints live env values and account emails.
      # Print the run link and the summary only. Read the full plan in Terraform Cloud.
      - name: Terraform Plan
        run: |
          set +e
          terraform plan -input=false -no-color -var "gcp_project_id=${{ vars.PROJECT_ID }}" > "$RUNNER_TEMP/plan.log" 2>&1
          status=$?
          grep -m1 -o 'https://app\.terraform\.io/app/[^ ]*' "$RUNNER_TEMP/plan.log"
          grep -E '^(Plan:|No changes\.)' "$RUNNER_TEMP/plan.log"
          exit $status
        working-directory: ${{ env.TF_ROOT }}
