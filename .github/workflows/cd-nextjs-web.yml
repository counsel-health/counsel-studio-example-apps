# This workflow is used to deploy the Next.js web app to Google Cloud Run
# Inspired by: https://github.com/google-github-actions/example-workflows/blob/main/workflows/deploy-cloudrun/cloudrun-docker.yml
name: Next.js Web CD

on:
  push:
    branches: [main]
    paths:
      - "web/nextjs/**"
      - ".github/workflows/cd-nextjs-web.yml"
  # Allow manual dispatch of the workflow
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GAR_LOCATION: ${{vars.REGION}} # GAR = Google Artifact Registry
  REGION: ${{vars.REGION}}
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REPOSITORY: ${{ vars.REPOSITORY }}
  SERVICE: "embedded-demo-nextjs-web"
  GOOGLE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS }}

jobs:
  deploy:
    permissions:
      contents: "read"
      id-token: "write"

    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: ./web/nextjs
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Instructions: https://github.com/google-github-actions/auth?tab=readme-ov-file#direct-wif
      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS }}"
          token_format: "access_token"

      - name: Login to Google Artifact Registry (GAR)
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS }}

      - name: Build and Push Container
        run: |
          docker build -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}" ./
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          wait: "true"
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
          flags: |
            --port=3001
            --allow-unauthenticated
            --cpu=2
            --memory=4Gi
            --max-instances=25
            --min-instances=3
            --concurrency=40
            --timeout=300
            --execution-environment=gen2
            --remove-env-vars=SERVER_HOST,IRON_SESSION_PASSWORD
            --set-secrets=SERVER_HOST=doppler-gsm-syncSERVER_HOST:latest
            --set-secrets=IRON_SESSION_PASSWORD=doppler-gsm-syncIRON_SESSION_PASSWORD:latest

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
