name: Terraform CD

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/cd-terraform.yml"

  # Allow manual dispatch of the workflow
  workflow_dispatch:

# Never cancel an apply in progress. A second run waits for the first.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_ROOT: terraform/environments/demo/gcp
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    name: terraform-apply
    # A manual dispatch from a different branch must not apply.
    if: github.ref == 'refs/heads/main'
    environment: terraform-apply
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read Terraform version
        id: tf-version
        run: echo "version=$(cat terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ${{ env.TF_ROOT }}

      # The Actions log is public, and an apply prints live env values and account emails.
      # Print the run link and the summary only. Read the full apply in Terraform Cloud.
      - name: Terraform Apply
        run: |
          set +e
          terraform apply -auto-approve -input=false -no-color -var "gcp_project_id=${{ vars.PROJECT_ID }}" > "$RUNNER_TEMP/apply.log" 2>&1
          status=$?
          grep -m1 -o 'https://app\.terraform\.io/app/[^ ]*' "$RUNNER_TEMP/apply.log"
          grep -E '^(Plan:|No changes\.|Apply complete)' "$RUNNER_TEMP/apply.log"
          exit $status
        working-directory: ${{ env.TF_ROOT }}
