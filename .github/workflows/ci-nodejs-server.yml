name: Node.js Server CI
on:
  pull_request:
    paths:
      - "server/nodejs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: ./server/nodejs
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Mount node_modules cache
        uses: useblacksmith/stickydisk@v1.4.0
        with:
          key: ${{ runner.os }}-counsel-studio-server-bun-${{ hashFiles('server/nodejs/bun.lock') }}
          path: server/nodejs/node_modules

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create env file
        run: bun run ci:write-env
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COUNSEL_WEBHOOK_SECRET: ${{ secrets.COUNSEL_WEBHOOK_SECRET }}
          ACCESS_CODE_CONFIGS: ${{ secrets.ACCESS_CODE_CONFIGS }}
          COUNSEL_PRIVATE_KEY_PEM: ${{ secrets.COUNSEL_PRIVATE_KEY_PEM }}

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Type Check
        run: bun run build

      - name: Compile
        run: bun run compile

      - name: Healthcheck
        run: bun run healthcheck
