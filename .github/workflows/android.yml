name: Android

on:
  # build is a required check. A path filter here would skip the whole
  # workflow and leave it pending forever, blocking the PR. The filter
  # lives in the changes job below instead, so the check always reports.
  pull_request:
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          filters: |
            relevant:
              - 'mobile/android/**'
              - '.github/workflows/android.yml'

  build:
    needs: changes
    runs-on: blacksmith-8vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: mobile/android/EmbeddedCounselDemo
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: needs.changes.outputs.relevant == 'true'
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Detekt (static analysis + ktlint formatting)
        if: needs.changes.outputs.relevant == 'true'
        run: ./gradlew :app:detekt --no-daemon --stacktrace

      - name: Lint
        if: needs.changes.outputs.relevant == 'true'
        run: ./gradlew :app:lint --no-daemon --stacktrace

      - name: Unit tests
        if: needs.changes.outputs.relevant == 'true'
        run: ./gradlew :app:test --no-daemon --stacktrace

      - name: Assemble debug APK
        if: needs.changes.outputs.relevant == 'true'
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload detekt report
        if: failure() && needs.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: detekt-report
          path: mobile/android/EmbeddedCounselDemo/app/build/reports/detekt/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success() && needs.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-debug
          path: mobile/android/EmbeddedCounselDemo/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
